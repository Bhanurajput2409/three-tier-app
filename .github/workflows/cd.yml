#Goal is deploy the application on self-hosted runner on AWS EC2 instance using GitHub Actions

name: CD
on:
  push:
    branches:
        - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Step 1: Fetch the latest code into the runner's workspace
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Build and run the app using Docker Compose
      - name: Deploy with Docker Compose
        run: |
          docker compose down --remove-orphans
          docker compose up --build -d
          
