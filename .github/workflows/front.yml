#Goal is to be create a forntend and backend workflow and linting and push to docker hub

name: front CI
on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup HTML linter
        uses: actions/setup-node@v3
        with:
          node-version: '16'
       # Installs HTMLHint locally to validate code quality
      - name: Install HTMLHint
        run: npm install --global htmlhint

      - name: Lint frontend HTML
        run: |
          if ! find frontend -type f -name "*.html" | grep -q .; then
            echo "No HTML files found in frontend/"
            exit 1
          fi
          htmlhint "frontend/**/*.html"
      # Log in to Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the Docker image to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/frontend:latest
