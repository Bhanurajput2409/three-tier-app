
name: CI

on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install HTMLHint
        run: npm install --global htmlhint

      - name: Lint frontend HTML
        run: |
          if ! find frontend -type f -name "*.html" | grep -q .; then
            echo "No HTML files found in frontend/"
            exit 1
          fi
          htmlhint "frontend/**/*.html"

      - name: Validate Docker Hub username
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: Set DOCKERHUB_USERNAME in GitHub Actions Variables"
            exit 1
          fi
          echo "Docker Hub username is configured"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: bhanupratap1224/frontend:latest

  Backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install ESLint
      run: npm install --global eslint

    - name: Lint backend JavaScript
      run: |
        if ! find backend -type f -name "*.js" | grep -q .; then
          echo "No JavaScript files found in backend/"
          exit 1
        fi
        eslint "backend/**/*.js"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
          context: ./backend
          push: true
          tags: bhanupratap1224/backend:latest
    
    