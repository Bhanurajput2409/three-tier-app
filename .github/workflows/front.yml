
name: Frontend CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install HTMLHint
        run: npm install --global htmlhint

      - name: Lint frontend HTML
        run: |
          if ! find frontend -type f -name "*.html" | grep -q .; then
            echo "No HTML files found in frontend/"
            exit 1
          fi
          htmlhint "frontend/**/*.html"

      - name: Validate Docker Hub username
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: Set DOCKERHUB_USERNAME in GitHub Actions Variables"
            exit 1
          fi
          echo "Docker Hub username is configured"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: bhanupratap1224/frontend:latest